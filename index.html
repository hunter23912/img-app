<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>img-app</title>
    <script>
      (() => {
        const cookieKey = 'img-app.theme.v1'
        const validTheme = (value) => value === 'light' || value === 'dark'

        const readCookieTheme = () => {
          try {
            const value = document.cookie
              .split('; ')
              .find((item) => item.startsWith(`${cookieKey}=`))
              ?.slice(cookieKey.length + 1)
            return validTheme(value) ? value : null
          } catch {
            return null
          }
        }

        let saved = null
        try {
          saved = localStorage.getItem(cookieKey)
        } catch {
          // Try the cookie below when localStorage is unavailable.
        }
        if (!validTheme(saved)) saved = readCookieTheme()

        const dark = saved === 'dark' || (!validTheme(saved) && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
